{% extends "layout.html" %}

{% block title %}Play Sudoku{% endblock %}

{% block body %}
<h1>Play Sudoku</h1>
<form method="POST">
    {% csrf_token %}
    <div class="grid">
        {% for field in form %}
            {{ field }}
        {% endfor %}
    </div>
    <div class="buttons">
        <button class="btn" type="submit" name="generate">Generate</button>
        <button class="btn" type="submit" name="reset">Reset</button>
        <button class="btn" type="submit" name="submit">Submit</button>
        <button class="btn" type="submit" name="solve">Solve</button>
    </div>
    {% if message %}
        <div class="message">{{ message }}</div>
    {% endif %}
</form>
{% endblock %}
{% load static %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'css/player.css' %}">
{% endblock %}
